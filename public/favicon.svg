<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo: navy-900 del sistema de tokens, esquinas de app -->
  <rect width="64" height="64" rx="14" fill="#102A43"/>

  <!-- Barras anuales: los aportes componiéndose, cada vez más intensas -->
  <g fill="#14B8A6">
    <rect x="12" y="45" width="7" height="7"  rx="1.5" opacity="0.25"/>
    <rect x="23" y="40" width="7" height="12" rx="1.5" opacity="0.4"/>
    <rect x="34" y="31" width="7" height="21" rx="1.5" opacity="0.6"/>
    <rect x="45" y="16" width="7" height="36" rx="1.5" opacity="0.85"/>
  </g>

  <!-- La curva exponencial: el interés despegando -->
  <path d="M10 47 C 24 45, 33 39, 41 29 C 45 24, 48 19, 50 14"
        fill="none" stroke="#7EDCD2" stroke-width="4.5" stroke-linecap="round"/>

  <!-- El valor futuro: donde termina la curva -->
  <circle cx="50" cy="14" r="5" fill="#7EDCD2"/>
</svg>
